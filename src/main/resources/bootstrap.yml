app:
  port: ${APP_PORT:8080}
  logging: debug
  server: 192.168.201.132:3306
  database: uniftsa
  user: root
  password: root
  consul:
    host: consul-service
    port: 8500
  mail:
    username: uid
    password: pwd
  security:
    jwt-secret: ${APP_JWT_SECRET:}
    issuer: ${APP_JWT_ISSUER:eterea.multitenant}
    access-token-ttl: ${APP_ACCESS_TOKEN_TTL:15m}
    refresh-token-ttl: ${APP_REFRESH_TOKEN_TTL:7d}
    cookie-secure: ${APP_SECURITY_COOKIE_SECURE:false}
    max-failed-attempts: ${APP_SECURITY_MAX_FAILED_ATTEMPTS:5}
    lock-duration: ${APP_SECURITY_LOCK_DURATION:15m}
    temporary-password-ttl: ${APP_SECURITY_TEMPORARY_PASSWORD_TTL:24h}
  tenant:
    datasource:
      maximum-pool-size: ${APP_TENANT_DB_POOL_MAX:8}
      minimum-idle: ${APP_TENANT_DB_POOL_MIN:1}
      idle-timeout: ${APP_TENANT_DB_IDLE_TIMEOUT:60s}
      max-lifetime: ${APP_TENANT_DB_MAX_LIFETIME:20m}
      connection-timeout: ${APP_TENANT_DB_CONNECTION_TIMEOUT:5s}
      validation-timeout: ${APP_TENANT_DB_VALIDATION_TIMEOUT:3s}
      eviction-after: ${APP_TENANT_DB_EVICTION_AFTER:15m}
      max-live-pools: ${APP_TENANT_DB_MAX_LIVE_POOLS:30}
      eviction-interval: ${APP_TENANT_DB_EVICTION_INTERVAL:1m}

server:
  address: 0.0.0.0
  port: ${app.port}

spring:
  application:
    name: multitenant-core-service
  cloud:
    consul:
      host: ${app.consul.host}
      port: ${app.consul.port}
      discovery:
        prefer-ip-address: true
        tags: eterea,tenant,core
  datasource:
    url: jdbc:mysql://${app.server}/${app.database}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&tcpKeepAlive=true
    username: ${app.user}
    password: ${app.password}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      max-lifetime: 1200000        # 20 minutos (seguro, << 4h)
      idle-timeout: 600000         # 10 minutos
      connection-timeout: 30000    # 30 segundos
      validation-timeout: 3000     # 3 segundos
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  sql:
    init:
      mode: ${APP_DB_INIT_MODE:always}
      schema-locations: classpath:db/refresh-token-schema.sql
      continue-on-error: false
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${app.mail.username}
    password: ${app.mail.password}
    properties:
      mail:
        smtp:
          starttls:
            enable: true
            required: true
          auth: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

logging:
  level:
    eterea.tenant.service: ${app.logging}
    web: ${app.logging}
    org:
      hibernate:
        SQL: ${app.logging}
        stat: ${app.logging}
        engine.transaction: ${app.logging}
      springframework:
        transaction: ${app.logging}
        cloud.config: ${app.logging}

feign:
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 60000

management:
  endpoints:
    web:
      exposure:
        include: scheduledtasks,env,health
  health:
    mail:
      enabled: false